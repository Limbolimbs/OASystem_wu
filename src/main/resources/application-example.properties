spring.application.name=OASystem

spring.thymeleaf.encoding=UTF-8

# このファイルをapplication.propertiesにコピーし、接続値を環境変数で設定する。
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL接続セッションも日本時間に統一する（DBの現在日時・更新日時用）。
spring.datasource.hikari.connection-init-sql=SET time_zone = '+09:00'

# SQLの適用後にスキーマを検証する。本番DBでupdateを使わない。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# 共通安全規則（サーバー時刻で判定）。自動ポーリングは無操作期限を延長しない。
oa.security.idle-timeout=30m
oa.security.absolute-timeout=8h
oa.security.failure-threshold=5
oa.security.lock-duration=15m
oa.security.failure-observation-window=24h
oa.security.second-failure-threshold=10
oa.security.second-lock-duration=60m
oa.security.protection-threshold=15
oa.security.source-limit=60
oa.security.source-window=1m
server.servlet.session.timeout=${oa.security.idle-timeout:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
# 転送ヘッダーを任意クライアントから信頼しない。
server.forward-headers-strategy=none
# 補助監査は公開鍵だけで暗号化する。秘密鍵は独立コンソールに保管。
oa.security.evidence-public-key=${OA_EVIDENCE_PUBLIC_KEY:file:D:/oa-maintenance/control-public/evidence-public.pem}

spring.thymeleaf.cache=false

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
