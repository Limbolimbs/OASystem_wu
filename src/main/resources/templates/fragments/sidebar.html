<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <body>
        <th:block th:fragment="sidebar(active, admin, sales)">
        <a class="skip-link" href="#mainContent">本文へ移動</a>
        <aside class="sidebar" id="portalNavigation" aria-label="業務ナビゲーション">
            <button class="navigation-close" type="button" data-navigation-close aria-label="メニューを閉じる">閉じる ×</button>
            <div class="brand">
                <div class="brand-mark">OA</div>
                <div>
                    <p class="brand-name">企業OAシステム</p>
                    <p class="brand-subtitle">社内ポータル</p>
                </div>
            </div>
            <p class="menu-label">メインメニュー</p>
            <nav class="nav-list" aria-label="メインメニュー">
                <a class="nav-item" th:classappend="${active == 'profile' ? 'active' : ''}" th:attr="aria-current=${active == 'profile' ? 'page' : null}" th:href="@{/my-page}">
                    <span class="nav-icon" aria-hidden="true">MY</span>
                    <span>マイページ</span>
                </a>
                <a class="nav-item" th:if="${admin}" th:classappend="${active == 'home' ? 'active' : ''}" th:attr="aria-current=${active == 'home' ? 'page' : null}" th:href="@{/home}">
                    <span class="nav-icon" aria-hidden="true">HM</span>
                    <span>ホーム</span>
                </a>
                <a class="nav-item" th:if="${admin or sales}" th:classappend="${active == 'sales' ? 'active' : ''}" th:attr="aria-current=${active == 'sales' ? 'page' : null}" th:href="@{/sales}">
                    <span class="nav-icon" aria-hidden="true">SL</span>
                    <span>営業実績管理</span>
                </a>
                <a class="nav-item" th:if="${admin}" th:classappend="${active == 'users' ? 'active' : ''}" th:attr="aria-current=${active == 'users' ? 'page' : null}" th:href="@{/users}">
                    <span class="nav-icon" aria-hidden="true">HR</span>
                    <span>従業員情報管理</span>
                </a>
                <a class="nav-item" th:if="${admin}" th:classappend="${active == 'departments' ? 'active' : ''}" th:attr="aria-current=${active == 'departments' ? 'page' : null}" th:href="@{/departments}">
                    <span class="nav-icon" aria-hidden="true">DP</span>
                    <span>部署管理</span>
                </a>
                <a class="nav-item" th:classappend="${active == 'attendance' ? 'active' : ''}" th:attr="aria-current=${active == 'attendance' ? 'page' : null}" th:href="@{/attendance}">
                    <span class="nav-icon" aria-hidden="true">AT</span>
                    <span>勤怠管理</span>
                </a>
                <a class="nav-item" th:classappend="${active == 'requests' ? 'active' : ''}" th:attr="aria-current=${active == 'requests' ? 'page' : null}" th:href="@{/attendance/manage}">
                    <span class="nav-icon" aria-hidden="true">RQ</span>
                    <span>勤怠申請・承認</span>
                </a>
                <a class="nav-item" th:classappend="${active == 'notices' ? 'active' : ''}" th:attr="aria-current=${active == 'notices' ? 'page' : null}" th:href="@{/notices}">
                    <span class="nav-icon" aria-hidden="true">NT</span>
                    <span>お知らせ管理</span>
                </a>
            </nav>
            <div class="sidebar-bottom">
                <form method="post" th:action="@{/logout}" data-logout>
                <button class="logout-button" type="submit">
                    <span class="nav-icon" aria-hidden="true">EX</span>
                    <span>ログアウト</span>
                </button>
                </form>
            </div>
        </aside>
        <button class="navigation-backdrop" type="button" data-navigation-backdrop aria-label="メニューを閉じる" tabindex="-1" hidden></button>
        </th:block>
    </body>
</html>
