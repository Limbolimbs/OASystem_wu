<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="csrf" th:if="${_csrf != null}">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <meta name="security_activity_url" th:if="${session.loginUserId != null}" th:content="@{/session/activity}">
    </th:block>
</head>
</html>
