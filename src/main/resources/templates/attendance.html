<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/security :: csrf}"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠管理 | 企業OAシステム</title>
    <link rel="stylesheet" th:href="@{/css/portal-layout.css}" href="/css/portal-layout.css">
    <link rel="stylesheet" th:href="@{/css/portal-components.css}" href="/css/portal-components.css">
    <link rel="stylesheet" href="/css/attendance.css" th:href="@{/css/attendance.css}">
    <link rel="stylesheet" href="/css/status-messages.css" th:href="@{/css/status-messages.css}">
    <link rel="stylesheet" href="/css/message-dialog.css" th:href="@{/css/message-dialog.css}">
    <th:block th:replace="~{fragments/portal :: feedback}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/sidebar :: sidebar('attendance', ${admin}, ${salesAccess})}"></aside>

    <section class="main-area">
        <header th:replace="~{fragments/portal :: header('勤怠管理', 'currentTime', ${user.realName})}"></header>

        <main class="content" id="mainContent" tabindex="-1">
            <section class="page-hero">
                <div>
                    <p class="eyebrow">勤怠管理</p>
                    <h1>勤怠管理</h1>
                    <p class="hero-description">出退勤・休憩の打刻、勤務状態の確認ができます。</p>
                </div>
                <div class="hero-actions">
                    <span class="attendance-date" th:text="${today}">2026-09-28</span>
                    <a class="attendance-date" th:href="@{/attendance/history}">勤怠履歴へ →</a>
                    <a class="attendance-date" th:href="@{/attendance/manage}">申請・承認へ →</a>
                </div>
            </section>

            <div class="alert alert-success" th:if="${successMessage}" role="status"
                 th:text="${successMessage}"></div>
            <div class="alert alert-error" th:if="${errorMessage}" role="alert"
                 th:text="${errorMessage}"></div>

            <section class="attendance-overview" aria-label="本日の勤怠" id="attendance-overview"
                     th:fragment="attendance-overview" data-ajax-region data-ajax-lock="attendance-clock"
                     th:attr="data-ajax-url=@{/attendance}">
                <article class="attendance-card">
                    <p class="attendance-label">本日の出勤</p>
                    <p class="attendance-value"
                       th:text="${todayRecord != null ? #temporals.format(todayRecord.clockInAt, 'yyyy-MM-dd HH:mm:ss') : '未打刻'}">未打刻</p>
                    <form th:action="@{/attendance/clock-in}" method="post" data-ajax data-ajax-targets="attendance-overview attendance-records">
                        <button class="attendance-button clock-in" type="submit"
                                th:disabled="${todayRecord != null}">出勤を打刻</button>
                    </form>
                </article>

                <article class="attendance-card">
                    <p class="attendance-label">現在の勤務の退勤</p>
                    <p class="attendance-value"
                       th:text="${todayRecord != null and todayRecord.clockOutAt != null ? #temporals.format(todayRecord.clockOutAt, 'yyyy-MM-dd HH:mm:ss') : '未打刻'}">未打刻</p>
                    <form th:action="@{/attendance/clock-out}" method="post" data-ajax data-ajax-targets="attendance-overview attendance-records">
                        <button class="attendance-button clock-out" type="submit"
                                th:disabled="${openRecord == null or openBreak != null}">退勤を打刻</button>
                    </form>
                </article>
                <article class="attendance-card">
                    <p class="attendance-label">休憩</p>
                    <p class="attendance-value" th:text="${openBreak != null ? '休憩中' : (todayRecord == null ? '未出勤' : (todayRecord.clockOutAt != null ? '退勤済み' : '勤務中'))}">未出勤</p>
                    <div class="attendance-actions">
                        <form th:action="@{/attendance/break-start}" method="post" data-ajax data-ajax-targets="attendance-overview attendance-records">
                            <button class="attendance-button clock-in" type="submit"
                                    th:disabled="${openRecord == null or openBreak != null}">休憩開始</button>
                        </form>
                        <form th:action="@{/attendance/break-end}" method="post" data-ajax data-ajax-targets="attendance-overview attendance-records">
                            <button class="attendance-button clock-out" type="submit"
                                    th:disabled="${openBreak == null}">休憩終了</button>
                        </form>
                    </div>
                </article>
            </section>

            <section class="table-panel attendance-records">
                <div class="table-toolbar attendance-toolbar">
                    <div class="table-title">
                        <h2 th:text="${reviewer ? '全従業員の勤怠状況' : '自分の勤怠状況'}">勤怠状況</h2>
                        <p th:text="${reviewer ? '指定日の予定と打刻を表示します。' : '直近30日間の予定と打刻を表示します。'}">
                            最近の記録を表示します。
                        </p>
                    </div>

                    <form class="attendance-filter" th:action="@{/attendance}" method="get" data-ajax data-ajax-targets="attendance-records">
                        <label for="workDate">勤務日</label>
                        <input id="workDate" name="date" type="date" th:value="${selectedDate}" required>
                        <button type="submit">検索</button>
                        <a data-ajax-targets="attendance-records" th:if="${!reviewer}" th:href="@{/attendance}">直近30日</a>
                    </form>
                </div>

                <div id="attendance-records" th:fragment="attendance-records" data-ajax-region
                     data-ajax-page-param="page" th:attr="data-ajax-url=@{/attendance(date=${reviewer or filtered ? selectedDate : null},page=${page})}">
                <div class="table-scroll">
                    <table class="attendance-table">
                        <thead>
                        <tr>
                            <th>勤務日</th>
                            <th th:if="${reviewer}">従業員</th>
                            <th>予定</th>
                            <th>勤務形態</th>
                            <th>出勤時刻</th>
                            <th>退勤時刻</th>
                            <th>休憩 / 実働</th>
                            <th>状態</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${rows}">
                            <td th:text="${row.workDate}">2026-09-28</td>
                            <td th:if="${reviewer}" th:text="${row.realName}">氏名</td>
                            <td th:text="${row.statuses.contains('在籍外') ? '在籍外' : row.schedule.dayType.label}">勤務日</td>
                            <td th:text="${row.schedule.workMode.label}">出社</td>
                            <td th:text="${row.clockInAt != null ? #temporals.format(row.clockInAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">--</td>
                            <td th:text="${row.clockOutAt != null ? #temporals.format(row.clockOutAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">--</td>
                            <td th:text="${row.breakMinutes + '分 / ' + row.workedMinutes + '分'}">--</td>
                            <td><span class="attendance-status" th:text="${row.statusText}">状態</span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rows)}">
                            <td class="empty-state" th:colspan="${reviewer ? 8 : 7}">該当する勤怠記録はありません。</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav class="attendance-pages" th:if="${reviewer}" aria-label="ページ移動">
                    <a data-ajax-targets="attendance-records" th:if="${adminRows.hasPrevious()}" th:href="@{/attendance(date=${selectedDate},page=${page - 1})}">前へ</a>
                    <span th:text="${(page + 1) + ' / ' + adminRows.totalPages + ' ページ'}">1 ページ</span>
                    <a data-ajax-targets="attendance-records" th:if="${adminRows.hasNext()}" th:href="@{/attendance(date=${selectedDate},page=${page + 1})}">次へ</a>
                </nav>
                </div>
            </section>
        </main>
    </section>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/portal-navigation.js" th:src="@{/js/portal-navigation.js}"></script>
<script src="/js/request-security.js" th:src="@{/js/request-security.js}"></script>
<script src="/js/message-dialog.js" th:src="@{/js/message-dialog.js}"></script>
<script src="/js/page-interactions.js" th:src="@{/js/page-interactions.js}"></script>
<script src="/js/attendance.js" th:src="@{/js/attendance.js}"></script>
</body>
</html>
