<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/security :: csrf}"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠履歴 | 企業OAシステム</title>
    <link rel="stylesheet" th:href="@{/css/portal-layout.css}" href="/css/portal-layout.css">
    <link rel="stylesheet" th:href="@{/css/portal-components.css}" href="/css/portal-components.css">
    <link rel="stylesheet" th:href="@{/css/attendance.css}" href="/css/attendance.css">
    <link rel="stylesheet" th:href="@{/css/status-messages.css}" href="/css/status-messages.css">
    <link rel="stylesheet" th:href="@{/css/message-dialog.css}" href="/css/message-dialog.css">
    <th:block th:replace="~{fragments/portal :: feedback}"></th:block>
</head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/sidebar :: sidebar('attendance', ${admin}, ${salesAccess})}"></aside>
    <section class="main-area">
        <header th:replace="~{fragments/portal :: header('勤怠履歴', 'currentTime', ${user.realName})}"></header>
        <main class="content" id="mainContent" tabindex="-1">
            <section class="page-hero"><div><p class="eyebrow">ATTENDANCE HISTORY</p>
                <h1>勤怠履歴</h1><p class="hero-description" id="history-title" th:fragment="history-title" data-ajax-region
                    th:attr="data-ajax-url=@{/attendance/history(userId=${target.id},from=${from},to=${to})}"
                    th:text="${target.realName + ' の勤務予定と打刻履歴'}">勤務履歴</p>
            </div><a class="attendance-date" th:href="@{/attendance}">打刻画面へ戻る</a></section>
            <section class="table-panel attendance-records">
                <div class="table-toolbar attendance-toolbar"><div class="table-title">
                    <h2>検索条件</h2><p>無効化した従業員の過去記録も確認できます。1回の検索は最大31日間です。</p>
                </div></div>
                <form class="attendance-filter history-filter" th:action="@{/attendance/history}" method="get"
                      data-ajax data-ajax-targets="history-results history-title">
                    <label th:if="${reviewer}">従業員<select name="userId">
                        <option th:each="person : ${users}" th:value="${person.id}" th:selected="${person.id == target.id}"
                                th:text="${person.realName + '（' + (person.status == 1 ? '有効' : '無効') + '）'}">従業員</option>
                    </select></label>
                    <label>開始日<input name="from" type="date" th:value="${from}" required></label>
                    <label>終了日<input name="to" type="date" th:value="${to}" required></label>
                    <button type="submit">検索</button>
                </form>
                <div class="table-scroll" id="history-results" th:fragment="history-results" data-ajax-region
                     th:attr="data-ajax-url=@{/attendance/history(userId=${target.id},from=${from},to=${to})}"><table class="attendance-table"><thead><tr>
                    <th>勤務日</th><th>日種別</th><th>勤務形態</th><th>予定始業</th><th>予定終業</th>
                    <th>出勤</th><th>退勤</th><th>休憩 / 実働</th><th>状態</th>
                </tr></thead><tbody>
                <tr th:each="row : ${rows}">
                    <td th:text="${row.workDate}">日付</td>
                    <td th:text="${row.statuses.contains('在籍外') ? '在籍外' : row.schedule.dayType.label}">日種別</td>
                    <td th:text="${row.schedule.workMode.label}">勤務形態</td>
                    <td th:text="${row.schedule.plannedStartAt != null ? #temporals.format(row.schedule.plannedStartAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                    <td th:text="${row.schedule.plannedEndAt != null ? #temporals.format(row.schedule.plannedEndAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                    <td th:text="${row.clockInAt != null ? #temporals.format(row.clockInAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                    <td th:text="${row.clockOutAt != null ? #temporals.format(row.clockOutAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                    <td th:text="${row.breakMinutes + '分 / ' + row.workedMinutes + '分'}">-</td>
                    <td th:text="${row.statusText}">状態</td>
                </tr>
                </tbody></table></div>
            </section>
        </main>
    </section>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/portal-navigation.js" th:src="@{/js/portal-navigation.js}"></script>
<script src="/js/request-security.js" th:src="@{/js/request-security.js}"></script>
<script th:src="@{/js/message-dialog.js}" src="/js/message-dialog.js"></script>
<script th:src="@{/js/page-interactions.js}" src="/js/page-interactions.js"></script>
<script th:src="@{/js/attendance.js}" src="/js/attendance.js"></script>
</body>
</html>
