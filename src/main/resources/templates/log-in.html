<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/security :: csrf}"></th:block>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		
		<title>ログイン | 企業OAシステム</title>
		
		<link rel="stylesheet" href="/css/login.css" th:href="@{/css/login.css}">
        <link rel="stylesheet" href="/css/message-dialog.css" th:href="@{/css/message-dialog.css}">
    <th:block th:replace="~{fragments/portal :: feedback}"></th:block>
</head>
<body>
	<main class="login-container">
		<!-- 企業案内 -->
		<section class="brand-panel">
			
			<header class="brand-header">
				<div class="brand-logo">OA</div>
				
				<div>
					<p class="brand-name">OA PORTAL</p>
					<p class="brand-system-name">OFFICE AUTOMATION SYSTEM</p>
				</div>
			</header>
			
			<div class="brand-message">
				<span class="brand-label">INTERNAL BUSINESS PLATFORM</span>
				
				<h1>
					社内業務を、<br>
					ひとつにつなぐ。
				</h1>
				
				<p>
					社員情報、各種申請、お知らせなどの社内業務を<br>
					安全かつスムーズに管理します。
				</p>
			</div>
			
			<div class="brand-footer">
				SECURE CORPORATE ACCESS
			</div>
			
		</section>
		
		<!-- ログインフォーム -->
		<section class="login-panel">
			
			<div class="login-box">
				
				<header>
					<p class="product-label">EMPLOYEE PORTAL</p>
					<h2 class="login-title">ログイン</h2>
					
					<p class="login-description">
						アカウント情報を入力して、システムにログインしてください。
					</p>
				</header>
				
				
				  
				  <div class="form-group">
					<label for="userName">ログインID（社員番号）</label>
					<input class="form-control"
					       id="userName"
						   name="userName"
						   type="text"
						   placeholder="社員番号または既存のログインID"
						   autocomplete="username"
						   >
				  </div>
				  
				  <div class="form-group">
					<label for="password">パスワード</label>
					
					<input class="form-control"
					       id="password"
						   name="password"
						   type="password"
						   placeholder="パスワードを入力"
						   autocomplete="current-password"
						   >
				  </div>
				  
				  <!-- ログイン失敗時のメッセージ -->
				  <div class="error-message"
					   role="alert" hidden>
				  </div>
				  
				  <button class="login-button" type="button">
					ログイン
				  </button>
				
				<div class="security-note">
					<span class="security-dot"></span>
					社内専用セキュアシステム
				</div>
				
			</div>
			
		  </section>
	   </main>	
	   
	   <footer class="page-footer">
		© 2026 OA PORTAL. All Rights Reserved.
	   </footer>
	   
	   
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="/js/request-security.js" th:src="@{/js/request-security.js}"></script>
    <script src="/js/message-dialog.js" th:src="@{/js/message-dialog.js}"></script>
	<script src="/js/login.js" th:src="@{/js/login.js}"></script>
</body>
</html>
