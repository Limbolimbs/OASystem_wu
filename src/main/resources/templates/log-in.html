<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		
		<title>ログイン|企業OAシステム</title>
		
		<style>
			:root{
				--navy: #ob2442;
				--navy-light: #163f6d;
				--blue: #2563eb;
				--blue-hover: #1d4ed8;
				--text: #1c2a3a;
				--muted: #6b7788;
				--border: #dbe3ec;
				--background: #eef3f8;
			}
			
			*{
				box-sizing: border-box;
			}
			
			html,
			body{
				min-height: 100%;
			}
			
			body{
				min-height: 100vh;
				margin: 0;
				padding: 40px 24px 70px;
				
				display: flex;
				align-items: center;
				justify-content: center;
				
				position: relative;
				overflow-x: hidden;
				
				color: var(--text);
				background:
					radial-gradient(circle at 12% 15%,
						rgba(37,99,235,0.13),transparent 28%),
					radial-gradient(circle at 90% 85%,
						rgba(11,36,66,0.12),transparent 30%),
					linear-gradient(135deg,#e9f0f7 0%,#f7f9fc 52%,#edf3f8 100%);
					
				font-family:
					"Noto Sans JP",
					"Yu Gothic UI",
					"Yu Gothic",
					"Meiryo",
					sans-serif;
			}
			
			/*背景装饰*/
			body::before,
			body::after{
				content: "";
				position: fixed;
				border-radius: 50%;
				pointer-events: none;
				z-index: 0;
			}
			
			body::before{
				width: 420px;
				height: 420px;
				top: -230px;
				right: -130px;
				background: linear-gradient(
					135deg,
					rgba(37,99,235,0.16),
					rgba(11,36,66,0.03)
				);
			}
			
			body::after{
				width: 330px;
				height: 330px;
				bottom: -210px;
				left: -100px;
				border: 55px solid rgba(37,99,235,0.07);
			}
			
			.login-container{
				width: min(1050px,100%);
				min-height: 610px;
				
				display: grid;
				grid-template-columns: 1.08fr 0.92fr;
				
				position: relative;
				z-index: 1;
				
				overflow: hidden;
				border: 1px solid rgba(255,255,255,0.75);
				border-radius: 24px;
				
				background: #ffffff;
				box-shadow:
					0 30px 80px rgba(15,35,60,0.16),
					0 8px 24px rgba(15,35,60,0.08);
			}
			
			/*左侧企业信息区域*/
			.brand-panel{
				padding: 58px 60px;
				
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				
				position: relative;
				overflow: hidden;
				
				color: #ffffff;
				background:
					linear-gradient(
						145deg,
						rgba(7,26,49,0.98),
						rgba(16,63,110,0.95)
					);
			}
			
			.brand-panel::after{
				content: "";
				width: 220px;
				height: 220px;
				
				position: absolute;
				top: -110px;
				right: -70px;
				
				border-radius: 50%
				background: rgba(50,130,230,0.17);
			}
			
			.brand-header,
			.brand-message,
			.brand-footer{
				position: relative;
				z-index: 1;
			}
			
			.brand-header{
				display: flex;
				align-items: center;
				gap: 15px;
			}
			
			.brand-logo{
				width: 52px;
				height: 52px;
				
				display: flex;
				align-items: center;
				justify-content: center;
				
				border: 1px solid rgba(255,255,255,0.35);
				border-radius: 14px;
				
				color: #ffffff;
				background: linear-gradient(135deg,#3b82f6,#1d5db4);
				
				font-size: 20px;
				font-weight: 800;
				letter-spacing: 0.05em;
				
				box-shadow: 0 10px 25px rgba(0,0,0,0.2);
			}
			
			.brand-name{
				margin: 0;
				font-size: 18px;
				font-weight: 700;
				letter-spacing: 0.08em;
			}
			
			.brand-system-name{
				margin: 5px 0 0;
				color: rgba(255,255,255,0.6);
				font-size: 11px;
				font-weight: 600;
				letter-spacing: 0.16em;
			}
			
			.brand-message{
				max-weight: 430px;
			}
			
			.brand-label{
				display: inline-block;
				margin-bottom: 22px;
				padding: 7px 12px;
				
				border: 1px solid rgba(255,255,255,0.2);
				border-radius: 20px;
				
				color: rgba(255,255,255,0.8);
				background: rgba(255,255,255,0.07);
				
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.14em;
			}
			
			.brand-message h1{
				margin: 0 0 22px;
				
				color: #ffffff;
				font0-size: clamp(32px,4vw,47px);
				line-height: 1.35;
				font-weight: 700;
				letter-spacing: 0.05em;
			}
			
			.brand-message p{
				margin: 0;
				
				color: rgba(255,255,255,0.7);
				font-size: 15px;
				line-height: 2;
				letter-spacing: 0.04em;
			}
			
			.brand-footer{
				color: rgba(255,255,255,0.45);
				font-size: 12px;
				letter-spacing: 0.08em;
			}
			
			/*右侧登陆区域*/
			.login-panel{
				padding: 60px 65px;
				
				display: flex;
				align-items: center;
				justify-content: center;
				
				background: rgba(255,255,255,0.98);
			}
			
			.login-box{
				width: 100%;
				max-width: 360px;
			}
			
			.product-label{
				margin: 0 0 13px;
				
				color: var(--blue);
				font-size: 12px;
				font-weight: 800;
				letter-spacing: 0.18em;
			}
			
			.login-title{
				margin: 0;
				
				color: var(--navy);
				font-size: 31px;
				font-weight:700;
				letter-spacing:0.06em;
			}
			
			.login-description{
				margin: 14px 0 36px;
				
				color: var(--muted);
				font-size: 14px;
				line-height: 1.8;
			}
			
			.form-group{
				margin-bottom: 22px;
			}
			
			.form-group label{
				display: block;
				margin-bottom: 9px;
				
				color: #344256;
				font-size: 14px;
				font-weight:600;
			}
			
			.form-control{
				width: 100%;
				height: 52px;
				padding: 0 16px;
				
				border: 1px solid var(--border);
				border-radius: 10px;
				outline: none;
				
				color: var(--text);
				background: #f9fbfd;
				
				font-family: inherit;
				font-size: 15px;
				
				transition:
					border-color 0.2s,
					background 0.2s,
					box-shadow 0.2s;
			}
			
			.form-control::placeholder{
				color: #a1acba;
			}
			
			.form-control:hover{
				border-color: var(--blue);
				background: #ffffff;
				box-shadow: 0 0 0 4px rgba(37,99,235,0.11);
			}
			
			.error-message{
				margin-bottom: 20px;
				padding: 12px 14px;
				
				border: 1px solid #fecaca;
				border-radius: 8px;
				
				color: #b42318;
				background: #fff5f5;
				
				font-size: 13px;
				line-height: 1.6;
			}
			
			.login-button{
				width: 100%;
				height: 52px;
				margin-top: 8px;
				
				border: none;
				border-radius: 10px;
				cursor: pointer;
				
				color: #fffff;
				background: linear-gradient(135deg,#2563eb,#174ca5);
				
				font-family: inherit;
				font-size: 15px;
				font-weight: 700;
				letter-spacing: 0.12em;
				
				box-shadow: 0 12px 25px rgba(37,99,235,0.23);
				
				transition: 
					transition 0.2s,
					box-shadow 0.2s,
					background 0.2s;
			}
			
			.login-button:hover{
				transform: translateY(-1px);
				background: linear-gradient(135deg,#1d5bd8,#123f8d);
				box-shadow: 0 15px 30px rgba(37,99,235,0.3);
			}
			
			.login-button:active{
				transform: translateY(0);
			}
			
			.security-note{
				margin-top: 25px;
				
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				
				color: #8490a0;
				font-size: 12px;
			}
			
			.security-dot{
				width: 7px;
				height: 7px;
				
				border-radius: 50%;
				background: #22c55e;
				box-shadow: 0 0 0 4px rgba(34,197,94,0.1);
			}
			
			.page-footer{
				width: 100%;
				
				position: absolute;
				bottom: 22px;
				left: 0;
				z-index: 1;
				
				text-align: center;
				color: #7f8b99;
				
				font-size: 11px;
				letter-spacing: 0.06em;
			}
		</style>
</head>	

<body>
	<main class="login-container">
		<!-- 左边企业介绍 -->
		<section class="brand-panel">
			
			<header class="brand-header">
				<div class="brand-logo">OA</div>
				
				<div
					<p class="brand-name">OA PORTAL</p>
					<p class="brand-system-name">OFFICE AUTOMATION SYSTEM</p>
				</div>
			</header>
			
			<div class="brand-message">
				<span class="brand-label">INTERNAL BUSINESS PLATFORM</span>
				
				<h1>
					社内業務を、<br>
					ひとつにつなぐ。
				</h1>
				
				<p>
					社員情報、各種申請、お知らせなどの社内業務を<br>
					安全かつスムーズに管理します。
				</p>
			</div>
			
			<div class="brand-footer">
				SECURE CORPORATE ACCESS
			</div>
			
		</section>
		
		<!-- 右边登录表单 -->
		<section class="login-panel">
			
			<div class="login-box">
				
				<header>
					<p class="product-label">EMPLOYEE PORTAL</p>
					<h2 class="login-title">ログイン</h2>
					
					<p class="login-description">
						アカウント情報を入力して、システムにログインしてください。
					</p>
				</header>
				
				
		        <form th:action="@{/users/logIn}" method="post">
				  
				  <div class="form-group">
					<label for="userName">ユーザー名</label>
					<input class="form-control"
					       id="userName"
						   name="userName"
						   type="text"
						   placeholder="ユーザー名を入力"
						   autocomplete="username"
						   required>
				  </div>
				  
				  <div class="form-group">
					<label for="password">パスワード</label>
					
					<input class="form-control"
					       id="password"
						   name="password"
						   type="password"
						   placeholder="パスワードを入力"
						   autocomplete="current-password"
						   required>
				  </div>
				  
				  <!-- 登录失败时显示 -->
				  <div class="error-message"
				       th:if="${errorMessage}"
					   th:text="${errorMessage}"
					   role="alert">
				  </div>
				  
				  <button class="login-button" type="submit">
					ログイン
				  </button>
				  
			    </form>
				
				<div class="security-note">
					<span class="security-dot"></span>
					社内専用セキュアシステム
				</div>
				
			</div>
			
		  </section>
	   </main>	
	   
	   <footer class="page-footer">
		© 2026 OA PORTAL. All Rights Reserved.
	   </footer>
	   
	   
</body>
</html>
