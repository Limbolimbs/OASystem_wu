<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"><title>個人設定</title><link rel="stylesheet" th:href="@{/css/control.css}"><link rel="stylesheet" th:href="@{/css/personnel.css}"></head><body><main class="personnel-workspace"><header class="workspace-header"><a href="/console" class="text-link">← セキュリティ監視</a><span class="operator" th:text="${operator}">担当者</span></header><section class="console-hero"><div><p class="eyebrow">本人の認証情報</p><h1>個人設定</h1><p class="muted">パスワード変更後、すべての既存セッションが失効します。</p></div></section><p id="personalNotice" class="message" role="status" hidden></p><section class="panel"><div class="panel-heading"><h2>パスワードの変更</h2></div><p class="panel-note" th:if="${owner}">最高管理者の資格情報は本機の保守領域で管理します。既存ID・パスワード・認証器は変更していません。</p><form id="personalPassword" class="personnel-form" th:unless="${owner}" novalidate><label for="currentPassword">現在のパスワード</label><input id="currentPassword" name="current" type="password" maxlength="128" autocomplete="current-password" required><label for="newPassword">新しいパスワード</label><input id="newPassword" name="password" type="password" maxlength="128" autocomplete="new-password" required><label for="confirmPassword">新しいパスワード（確認）</label><input id="confirmPassword" name="confirm" type="password" maxlength="128" autocomplete="new-password" required><p class="field-note">空白を含まない半角12～128文字。大文字・小文字・数字・記号のうち3種類以上。</p><label for="personalOtp">新しい認証コード</label><input id="personalOtp" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required><button type="submit" class="primary">変更してログアウト</button></form><p class="panel-note">認証器の紛失・再登録は最高管理者へ依頼してください。旧認証器は再招待時に失効します。</p></section></main><script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script><script th:src="@{/js/request-security.js}"></script><script th:src="@{/js/personal.js}"></script></body></html>
