spring.application.name=ControlConsole
server.address=127.0.0.1
server.port=${CONTROL_PORT:9443}
server.ssl.enabled=true
server.ssl.key-store=${CONTROL_KEYSTORE}
server.ssl.key-store-password=${CONTROL_CERT_PASSWORD}
server.ssl.key-store-type=PKCS12
server.servlet.session.cookie.name=__Host-CONTROL_SESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=10m
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=${CONTROL_DB_URL}
spring.datasource.username=${CONTROL_DB_USER}
spring.datasource.password=${CONTROL_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-init-sql=SET time_zone = '+09:00'
spring.sql.init.mode=never
spring.thymeleaf.cache=true
logging.level.org.springframework.jdbc=INFO
control.operator-id=${CONTROL_OPERATOR_ID}
control.login-id=${CONTROL_LOGIN_ID}
control.password-hash=${CONTROL_PASSWORD_HASH}
control.totp-secret=${CONTROL_TOTP_SECRET}
control.member-key=${CONTROL_MEMBER_KEY:}
control.failure-observation-window=${CONTROL_FAILURE_OBSERVATION_WINDOW:24h}
control.first-threshold=${CONTROL_FIRST_THRESHOLD:5}
control.first-lock=${CONTROL_FIRST_LOCK:15m}
control.second-threshold=${CONTROL_SECOND_THRESHOLD:10}
control.second-lock=${CONTROL_SECOND_LOCK:60m}
control.protection-threshold=${CONTROL_PROTECTION_THRESHOLD:15}
control.evidence-private-key=${CONTROL_EVIDENCE_PRIVATE_KEY:}
control.evidence-public-key=${CONTROL_EVIDENCE_PUBLIC_KEY:file:D:/oa-maintenance/control-public/evidence-public.pem}
control.geoip-city=${CONTROL_GEOIP_CITY:D:/oa-maintenance/geoip/city.mmdb}
control.geoip-asn=${CONTROL_GEOIP_ASN:D:/oa-maintenance/geoip/asn.mmdb}
